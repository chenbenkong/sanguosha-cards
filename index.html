/* ══════════════════════════════════════════════════════════
   v30 · 质感与节奏
   两套主题共用：克制的入场节奏、跟随指针的柔光、灯箱推近
   原则：只做光影与位移，绝不加滤镜/网格/混合到卡面文字上
   ══════════════════════════════════════════════════════════ */

/* 从半透明起步而非全透明：加载慢或截图时文字也不会消失 */
@keyframes moRise{from{opacity:.55;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes moLine{from{transform:scaleX(.02)}to{transform:scaleX(1)}}
@keyframes moPush{from{opacity:0;transform:scale(.968) translateY(14px)}to{opacity:1;transform:none}}

/* ── 门厅：分层入场，像揭幕 ── */
.curtain .eyebrow{animation:moRise .95s cubic-bezier(.22,.61,.36,1) both}
.curtain h1{animation:moRise 1.05s .08s cubic-bezier(.22,.61,.36,1) both}
.curtain p{animation:moRise 1.05s .17s cubic-bezier(.22,.61,.36,1) both}
.curtain-meta{animation:moRise 1.05s .26s cubic-bezier(.22,.61,.36,1) both}
.scroll-cue{animation:moRise 1.3s .45s cubic-bezier(.22,.61,.36,1) both}

/* ── 分卷细线：进入视口时从左展开 ── */
h2::after{transform-origin:left center}
h2.in-view::after{animation:moLine 1.15s cubic-bezier(.22,.61,.36,1) both}

/* ── 卡片：沿用既有纯位移渐显，只把缓动与交错节奏做精致 ── */
figure{transition:translate .8s cubic-bezier(.22,.61,.36,1),transform .3s cubic-bezier(.22,.61,.36,1)}
figure.pre{translate:0 30px}

/* ── 跟随指针的柔光：只走 soft-light，不改变文字对比度 ── */
.fw{position:relative}
.fw::after{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
 border-radius:inherit;opacity:0;mix-blend-mode:soft-light;

   rgba(255,255,255,.20),rgba(255,255,255,0) 62%);
 transition:opacity .5s ease}
html:not(.theme-light) .fw::after{

   rgba(230,196,128,.24),rgba(230,196,128,0) 62%)}
figure:hover .fw::after{opacity:.9}

/* 悬停只提亮框线，不再放大卡面 */
html:not(.theme-light) figure:hover .fw{border-color:rgba(198,168,107,.72)}
html.theme-light figure:hover .fw{border-color:rgba(23,22,20,.5)}

/* ── 灯箱：缓慢推近，代替生硬弹出 ── */
#lb.on .lb-stage{animation:moPush .55s cubic-bezier(.22,.61,.36,1) both}
#lb.on .lb-stage img{animation:none}
#lb .lb-stage img{transition:box-shadow .5s ease}

/* ── 浮层与进度线 ── */
#kbhelp.on{animation:moPush .35s cubic-bezier(.22,.61,.36,1) both}

if ('IntersectionObserver' in window && !(window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches)) {

    hs.forEach(function (h) { if (h.offsetTop <= line) curHead = h; });
    $$('.fnav a').forEach(function (a) {
      a.classList.toggle('on', !!curHead && a.dataset.t === curHead.id);
    });
  };

  /* ── 8. 修复分区标题：策展短句插入后，基线 apply 会取错兄弟节点 ── */
  var fixSections = function () {
    $$('main h2').forEach(function (h) {
      var note = h.nextElementSibling;
      var g = note;
      if (g && g.classList && g.classList.contains('gal-note')) g = g.nextElementSibling;
      if (!g || !g.classList || !g.classList.contains('grid')) return;
      var any = Array.prototype.some.call(g.children, function (f) {
        return f.style.display !== 'none';
      });
      h.style.display = any ? '' : 'none';
      if (note && note.classList && note.classList.contains('gal-note')) {
        note.style.display = any ? '' : 'none';
      }
      g.style.display = any ? '' : 'none';
    });
  };

  /* ── 9. 包装 apply：入藏过滤 + 计数 + 分区修正 + URL ── */
  var _applyG = apply;
  apply = function () {
    _applyG();
    if (favOnly) {
      figs.forEach(function (f) {
        if (!favSet[keyOf(f)]) f.style.display = 'none';
      });
    }
    fixSections();
    var total = 0;
    figs.forEach(function (f) { if (f.style.display !== 'none') total++; });
    if (cntEl) cntEl.textContent = total + ' / ' + figs.length;
    var emptyEl = $('.empty');
    if (emptyEl) emptyEl.style.display = total === 0 ? 'block' : 'none';
    writeUrl();
    syncNavFix();
  };

  /* ── 10. 包装 open：展签按钮状态 + 单件链接 ── */
  var _openG = open;
  open = function (i) {
    _openG(i);
    paintFavBtn();
    writeUrl();
  };

  if ('MutationObserver' in window) {
    new MutationObserver(function () { paintFavBtn(); writeUrl(); })
      .observe(lb, { attributes: true, attributeFilter: ['class'] });
  }

  /* ── 11. 快捷键帮助卡 ── */
  var helpBg = document.createElement('div');
  helpBg.id = 'kbhelpbg';
  var help = document.createElement('div');
  help.id = 'kbhelp';
  help.innerHTML =
    '<button class="x" type="button" aria-label="关闭">&times;</button>' +
    '<h3>观览捷径</h3><div class="sub">Keyboard Shortcuts</div>' +
    '<dl>' +
      '<dt>&larr; / &rarr;</dt><dd>上一件 / 下一件</dd>' +
      '<dt>Esc</dt><dd>退出细览</dd>' +
      '<dt>Home / End</dt><dd>本卷首件 / 末件</dd>' +
      '<dt>F</dt><dd>入藏 / 移出</dd>' +
      '<dt>C</dt><dd>复制本件链接</dd>' +
      '<dt>/</dt><dd>聚焦搜索</dd>' +
      '<dt>?</dt><dd>显示本页</dd>' +
    '</dl>' +
    '<p class="tip">入藏名单保存在本机浏览器，换设备不会同步。</p>';
  document.body.appendChild(helpBg);
  document.body.appendChild(help);
  var toggleHelp = function (on) {
    var show = typeof on === 'boolean' ? on : !help.classList.contains('on');
    help.classList.toggle('on', show);
    helpBg.classList.toggle('on', show);
  };
  helpBg.onclick = function () { toggleHelp(false); };
  $('.x', help).onclick = function () { toggleHelp(false); };

  var meta = $('.curtain-meta');
  if (meta) {
    var hlink = document.createElement('a');
    hlink.className = 'curtain-help';
    hlink.textContent = '捷径 ?';
    hlink.onclick = function (e) { e.preventDefault(); toggleHelp(true); };
    meta.appendChild(hlink);
  }

  /* ── 12. 键盘：保留基线方向键 / Esc，追加观览捷径 ── */
  var _kd = document.onkeydown;
  document.onkeydown = function (e) {
    if (_kd) _kd(e);
    var t = e.target;
    var typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA');
    if (typing) { if (e.key === 'Escape' && t.blur) t.blur(); return; }
    var on = lb.classList.contains('on');
    if (e.key === '?') { e.preventDefault(); toggleHelp(); return; }
    if (e.key === 'Escape' && help.classList.contains('on')) { toggleHelp(false); return; }
    if (e.key === '/' && !on) { e.preventDefault(); q.focus(); q.select(); return; }
    if (!on) return;
    if (e.key === 'f' || e.key === 'F') toggleFavCur();
    else if (e.key === 'c' || e.key === 'C') copyLink();
    else if (e.key === 'Home') { e.preventDefault(); if (vis().length) open(0); }
    else if (e.key === 'End') { e.preventDefault(); if (vis().length) open(vis().length - 1); }
  };

  /* ── 13. 阅读进度 + 页头收紧 ── */
  var prog = document.createElement('div');
  prog.id = 'progress';
  document.body.appendChild(prog);
  var rafBusy = false;
  var onScroll = function () {
    if (rafBusy) return;
    rafBusy = true;
    requestAnimationFrame(function () {
      rafBusy = false;
      var max = document.documentElement.scrollHeight - window.innerHeight;
      var r = max > 0 ? Math.min(1, window.scrollY / max) : 0;
      prog.style.width = (r * 100).toFixed(2) + '%';
      if (header) header.classList.toggle('slim', window.scrollY > 180);
      syncNavFix();

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  window.addEventListener('load', function () {
    syncNavFix();
    onScroll();

  /* ── 14. 窄屏短文案，避免工具行被切半截 ── */

     用户本次手动点过「筛选」后就不再干预 */
  var fb0 = document.getElementById('filters');

    });

  if (!ftogTouched && window.innerWidth <= 760 && fb0 && ft0 && !fb0.classList.contains('hide')) {
    fb0.classList.add('hide');
    ft0.classList.add('collapsed');
    if (ft0.lastElementChild) ft0.lastElementChild.textContent = '▸';
  }

  if (q) q.oninput = apply;              // ui.js 保存的是旧引用，这里指向最新包装
  paintMarks();
  paintFavBtn();
  onScroll();

  if (sp0.get('fav') === '1' && favBtnTop) {
    favOnly = true;
    favBtnTop.classList.add('on');
  }
  apply();

  var want = sp0.get('card');
  if (want) {
    var target = null;
    for (var i = 0; i < figs.length; i++) {
      if (keyOf(figs[i]) === want) { target = figs[i]; break; }

    if (target) {

        q.value = '';

        if (favBtnTop) { favOnly = false; favBtnTop.classList.remove('on'); }
        apply();
        idx = vis().indexOf(target);

      if (idx >= 0) open(idx);

    }

})();

<script id="atelier-v28-js">
/* ══════════════════════════════════════════════════════════
   v29 · 双展厅主题控制器
   深色馆藏（v27，默认） ⇄ 白盒子（v28）
   白盒子的 CSS 用 media="not all" 整块开关，文案在这里按主题双向切换
   依赖：museum.js / gallery.js 已生成的 DOM；boot 脚本已在 <head> 预热
   ══════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  var KEY = 'sgk_theme';
  var root = document.documentElement;
  var sheet = document.getElementById('atelier-v28');

  /* ── 1. 深色馆藏版的原始文案快照 ── */
  var eb = $('.eyebrow'), h1 = $('.curtain h1'), intro = $('.curtain p'), meta = $('.curtain-meta');
  var galNo = $$('main h2 .gal-no'), galEn = $$('main h2 .gal-en'), fnav = $$('.fnav a');
  var plNo = $$('.pl-no'), specHead = $('.spec-head');
  var tools = $$('header .tools .reset');

  var metaSpans = meta ? $$('span', meta) : [];
  var metaText = metaSpans.map(function (s) { return s.textContent; });
  var tech = metaSpans.length >= 4
    ? { span: metaSpans[3], sep: metaSpans[3].previousElementSibling }
    : null;

  var snap = {
    eb: eb ? eb.textContent : '',
    h1: h1 ? h1.textContent : '',
    intro: intro ? intro.textContent : '',
    galNo: galNo.map(function (x) { return x.textContent; }),
    galEn: galEn.map(function (x) { return x.textContent; }),
    fnav: fnav.map(function (x) { return x.innerHTML; }),
    plNo: plNo.map(function (x) { return x.textContent; }),
    specHead: specHead ? specHead.textContent : '',
    tools: tools.map(function (a) { return { el: a, id: a.id, text: a.textContent }; })
  };

  /* 竖排提示：共用一个节点，靠 theme.css 控制显隐 */
  var cue = document.createElement('span');
  cue.className = 'scroll-cue';
  cue.textContent = 'SCROLL TO VIEW';
  var curtain = $('.curtain');
  if (curtain) curtain.appendChild(cue);

  var roman = { wei: 'I', shu: 'II', wu: 'III', qun: 'IV', shen: 'V', jin: 'VI' };
  var en = { wei: 'WEI', shu: 'SHU', wu: 'WU', qun: 'QUN', shen: 'SHEN', jin: 'JIN' };
  var names = { wei: '魏', shu: '蜀', wu: '吴', qun: '群', shen: '神', jin: '晋' };

  /* ── 2. 按主题渲染两套文案 ── */
  function setCopy(t) {
    var light = t === 'light';

    if (eb) eb.textContent = light ? 'THE SANGUO PORTRAIT ARCHIVE' : snap.eb;
    if (h1) h1.textContent = light ? '三国武将图录' : snap.h1;
    if (intro) intro.textContent = light
      ? '七百零三帧武将画像，依魏、蜀、吴、群、神分卷编次。逐帧编号，以备检览。'
      : snap.intro;

    metaSpans.forEach(function (s, i) {
      s.style.display = '';
      s.textContent = metaText[i];
    });
    if (tech) {
      tech.span.style.display = light ? 'none' : '';
      if (tech.sep) tech.sep.style.display = light ? 'none' : '';
    }
    if (light && metaSpans.length >= 3) {
      metaSpans[0].textContent = '五卷';
      metaSpans[1].textContent = '704 件';
      metaSpans[2].textContent = '魏 · 蜀 · 吴 · 群 · 神';
    }

    $$('main h2').forEach(function (h, i) {
      var no = $('.gal-no', h), ge = $('.gal-en', h);
      if (no) no.textContent = light && roman[h.id] ? roman[h.id] : (snap.galNo[i] || no.textContent);
      if (ge) ge.textContent = light && en[h.id] ? en[h.id] : (snap.galEn[i] || ge.textContent);
    });

    fnav.forEach(function (a, i) {
      if (!light) { a.innerHTML = snap.fnav[i]; return; }
      var n = (a.textContent.match(/\d+/) || [])[0] || '';
      a.innerHTML = (names[a.dataset.t] || a.textContent.trim()) + (n ? '<i>' + n + '</i>' : '');
    });

    plNo.forEach(function (el, i) {
      el.textContent = light ? (snap.plNo[i] || '').replace(/^No\.\s*/, '') : snap.plNo[i];
    });

    if (specHead) specHead.textContent = light ? 'WORK IN FOCUS' : snap.specHead;

    snap.tools.forEach(function (it) {
      if (it.id === 'favonly') return;  // 内部有 <b> 计数，不能用 textContent 重写
      if (!light) { it.el.textContent = it.text; return; }
      if (it.id === 'reset') it.el.textContent = '重置';
      else if (it.text.indexOf('随机') === 0) it.el.textContent = '随机';
    });
  }

  /* ── 3. 切换入口 ── */
  var btn = document.createElement('a');
  btn.className = 'reset';
  btn.id = 'themetog';
  btn.setAttribute('role', 'button');
  var toolsBox = $('header .tools');
  if (toolsBox) toolsBox.appendChild(btn);

  var current = 'dark';
  function applyTheme(t, init) {
    var light = t === 'light';
    current = light ? 'light' : 'dark';
    root.classList.toggle('theme-light', light);
    if (sheet) sheet.media = light ? 'all' : 'not all';
    setCopy(current);
    if (btn) {
      btn.innerHTML = '<i class="tg-ico">' + (light ? '☾' : '☀') + '</i>' + (light ? '深色' : '浅色');
      btn.title = light ? '切换到深色展厅' : '切换到浅色展厅';
      btn.setAttribute('aria-label', btn.title);
    }
    if (!init) {
      try { localStorage.setItem(KEY, current); } catch (e) {}
      // 切到白盒子时按该模式的默认状态收起筛选；用户主动展开过则不干预
      if (light) maybeCollapse();
    }
  }
  if (btn) btn.onclick = function () { applyTheme(current === 'light' ? 'dark' : 'light', false); };

  /* ── 4. 白盒子首屏默认收起筛选；深色保持原样；用户展开过就不再干预 ── */
  var fb = document.getElementById('filters'), ft = document.getElementById('ftog');
  if (fb && ft) {
    ft.addEventListener('click', function () {
      setTimeout(function () {
        try { localStorage.setItem('sgk_hidef', fb.classList.contains('hide') ? '' : '0'); } catch (e) {}
      }, 0);
    });
  }
  function maybeCollapse() {
    if (!fb || !ft) return;
    var sp = new URLSearchParams(location.search);
    var hasFilter = ['p', 'sex', 'l', 'v', 'hp', 'm', 'q'].some(function (k) { return sp.has(k); });
    var pref = null;
    try { pref = localStorage.getItem('sgk_hidef'); } catch (e) {}
    if (!hasFilter && pref !== '0' && !fb.classList.contains('hide')) {
      fb.classList.add('hide');
      ft.classList.add('collapsed');
      if (ft.lastElementChild) ft.lastElementChild.textContent = '▸';
    }
  }

  /* ── 5. 初始化（boot 已预热 head 里的 class 与 media，这里做幂等校准） ── */
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  var initial = root.classList.contains('theme-light') || saved === 'light' ? 'light' : 'dark';
  applyTheme(initial, true);
  if (initial === 'light') maybeCollapse();

  // gallery.js 的窄屏短文案会在 resize 时覆盖工具条，这里重新按主题校准
  window.addEventListener('resize', function () { setCopy(current); });
})();

</script>
<script id="motion-v30-js">
/* ══════════════════════════════════════════════════════════
   v30 · 质感与节奏脚本
   只做两件事：卡片按列交错浮入、分卷细线进入视口时展开
   不改变任何筛选 / 灯箱 / 主题逻辑
   ══════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  if (typeof figs === 'undefined') return;
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if (reduce) return;

  /* 1. 同一行的卡片依次浮入，避免整排同时弹起 */
  $$('.grid').forEach(function (g) {
    var cols = (getComputedStyle(g).gridTemplateColumns || '').split(' ').filter(Boolean).length || 4;
    Array.prototype.forEach.call(g.children, function (f, i) {
      if (f.tagName === 'FIGURE') f.style.transitionDelay = ((i % cols) * 65) + 'ms';
    });
  });

  /* 2. 分卷标题进入视口时，底部细线从左展开 */
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) return;
        e.target.classList.add('in-view');
        io.unobserve(e.target);
      });
    }, { rootMargin: '0px 0px -10% 0px' });
    $$('main h2').forEach(function (h) { io.observe(h); });
  }
})();

</script>

<script id="card3d-v33-js">
/* ══════════════════════════════════════════════════════════
   实体 3D 卡牌 · 接入层
   A. 首页卡墙：鼠标移到卡上即变实体，按住拖动直接旋转（不必点开）
   B. 细览灯箱：点开后整张卡可翻转、推近
   内核约 500KB，按需加载；不可用 / 加载失败时原图照常显示
   ══════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  var VENDOR = './vendor/card3d.js?v=62';
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var theme = function () {
    return document.documentElement.classList.contains('theme-light') ? 'light' : 'dark';
  };

  /* ── 内核：两条通道共用同一次请求 ── */
  var coreState = 0;                        // 0 未开始 · 1 加载中 · 2 就绪 · 3 失败
  var coreQ = [];
  var withCore = function (cb) {
    if (window.SGKCard3D) { cb(); return; }
    if (coreState === 3) return;
    coreQ.push(cb);
    if (coreState === 1) return;
    coreState = 1;
    var s = document.createElement('script');

  new MutationObserver(function () {
    if (!viewer) return;

  btnReset.addEventListener('click', function (e) {
    e.stopPropagation();
    if (!viewer) return;

    hintEl.textContent = '拖动旋转 · 双击翻面 · 双指推近';
  }

  /* 关闭后稍作停顿再释放 WebGL 上下文，来回翻页不必反复重建 */
  var idleTimer = null;
  new MutationObserver(function () {
    if (lb.classList.contains('on')) { clearTimeout(idleTimer); return; }
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () {
      if (viewer && !lb.classList.contains('on')) {
        try { viewer.dispose(); } catch (e) {}
        viewer = null;
        window.__SGK3D_VIEW = null;
        wrap.classList.remove('on');
        bar.classList.remove('on');
      }
    }, 45000);
  }).observe(lb, { attributes: true, attributeFilter: ['class'] });
})();

      b.innerHTML = '详 情<i>→</i>';
      var nm = f.dataset.k ? decodeURIComponent(f.dataset.k) : '';
      b.setAttribute('aria-label', '查看 ' + nm + ' 的详情');
      b.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        try {
          var v = typeof vis === 'function' ? vis() : list;
          var i = v.indexOf(f);
          if (i >= 0 && typeof open === 'function') open(i);
        } catch (err) {}
      });
      wrap.appendChild(b);
      cap.appendChild(wrap);
    });

    /* 鼠标精度够的设备：点卡本身不再开详览，只认这枚按钮（免得转动时误触） */
    if (hoverFine) {
      list.forEach(function (f) { f.onclick = null; });
    } else {
      /* 摸屏：按钮自己会冒泡，去掉重复触发 */
      list.forEach(function (f) {
        f.addEventListener('click', function (e) {
          if (e.target && e.target.closest && e.target.closest('.fig-act')) e.stopPropagation();
        }, true);
      });
    }
  })();

  /* ═══════════ B · 详览档案面板 ═══════════ */
  var lb = document.getElementById('lb');
  if (!lb) return;
  var stage = lb.querySelector('.lb-stage');
  var info = lb.querySelector('.info');
  if (!stage || !info) return;

  var file = document.createElement('div');
  file.className = 'd-file';
  var lastKey = '';
  var actions = info.querySelector('.spec-actions');
  if (actions) info.insertBefore(file, actions); else info.appendChild(file);

  var cardData = function (f) {
    var d = null;
    try { d = BYK.get(decodeURIComponent(f.dataset.k)); } catch (e) { d = null; }
    return d || {};
  };

  /* ── 语音：一枚 audio 复用；同一句再点一次就停 ── */
  var audio = document.createElement('audio');
  audio.preload = 'none';
  audio.style.display = 'none';
  document.body.appendChild(audio);
  var playingBtn = null;

  var toast = function (msg) {
    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('on');
    setTimeout(function () { el.classList.remove('on'); }, 2200);
  };

  var activeW = 0;

  var paintPlaying = function (btn) {
    var on = file.querySelectorAll('.d-play.on');
    for (var i = 0; i < on.length; i++) on[i].classList.remove('on');
    var lines = file.querySelectorAll('.d-line.on');
    for (var j = 0; j < lines.length; j++) {
      lines[j].classList.remove('on');
      lines[j].style.removeProperty('--p');
    }
    if (btn) {
      btn.classList.add('on');
      activeLine = btn.closest ? btn.closest('.d-line') : null;
      if (activeLine) {
        activeLine.classList.add('on');
        activeLine.style.setProperty('--p', '0');
        // 擦除宽度按「这一句文字本身」算，而不是整栏宽度，
        // 否则短句会一下子全亮
        var baseEl = activeLine.querySelector('.d-base');
        var bw = baseEl ? baseEl.getBoundingClientRect().width : 0;
        var cw = baseEl && baseEl.parentElement ? baseEl.parentElement.getBoundingClientRect().width : 0;
        activeW = (bw > 0 && cw > 0) ? Math.min(bw, cw) : cw;
        activeLine.style.setProperty('--pw', '0px');
      }
    } else {
      activeLine = null;
    }
    playingBtn = btn || null;
  };

  /* ── 合成朗读：写给没有真人配音的台词 ── */
  var synth = window.speechSynthesis || null;
  var synthTimer = 0, synthDur = 0, synthAt = 0;
  var zhVoice = null;

  /* 音色池：Edge/Chrome 的中文语音名字差异很大，按名字特征分男女、分年龄挑 */
  var POOL = {
    female: [/Xiaoxiao/i, /Xiaoyi/i, /Xiaomo/i, /Xiaorui/i, /Xiaohan/i, /Huihui/i, /Yaoyao/i, /普通话/i, /國語/i],
    male: [/Yunxi/i, /Yunjian/i, /Yunyang/i, /Yunze/i, /Yunfeng/i, /Kangkang/i, /普通话/i]
  };
  var zhList = [];

  var readZh = function () {
    if (!synth || !synth.getVoices) return [];
    var all = synth.getVoices() || [];
    return all.filter(function (v) {
      return /^zh/i.test(v.lang) || /Chinese|Huihui|Yaoyao|Kangkang|Xiaoxiao|Yunxi|Yunjian|普通话|國語|粤語/i.test(v.name);
    });
  };

  /* 同一性别里，按「年轻 / 成熟 / 沉厚」换优先级 */
  var pickVoice = function (sex, tone) {
    if (!zhList.length) zhList = readZh();
    if (!zhList.length) return null;
    var order = sex === '女' ? POOL.female.slice() : POOL.male.slice();
    if (sex === '女') {
      if (tone === 'young') order = [/Xiaoxiao/i, /Xiaoyi/i, /Xiaohan/i].concat(order);
      if (tone === 'grave') order = [/Xiaomo/i, /Huihui/i, /Xiaorui/i].concat(order);
    } else {
      if (tone === 'young') order = [/Yunxi/i, /Yunyang/i, /Kangkang/i].concat(order);
      if (tone === 'grave') order = [/Yunjian/i, /Yunze/i, /Yunfeng/i].concat(order);
    }
    for (var i = 0; i < order.length; i++) {
      for (var j = 0; j < zhList.length; j++) {
        if (order[i].test(zhList[j].name)) return zhList[j];
      }
    }
    // 实在没有对应性别的，退回该语言的第一条
    return zhList[0];
  };

  if (synth) {
    zhList = readZh();
    if (synth.addEventListener) synth.addEventListener('voiceschanged', function () { zhList = readZh(); });
    else synth.onvoiceschanged = function () { zhList = readZh(); };
  }
  // 调试句柄：方便核对某个角色会落到哪个音色
  window.__SGK_TTS = { pick: pickVoice, list: function () { return readZh().map(function (v) { return v.name; }); } };

  var stopSynth = function () {
    if (synthTimer) { clearInterval(synthTimer); synthTimer = 0; }
    if (synth && (synth.speaking || synth.pending)) {
      try { synth.cancel(); } catch (e) {}
    }
  };

  var warnedVoice = false;
  var speak = function (btn, text, sex, tone) {
    if (!synth) { toast('当前浏览器不支持语音合成'); return; }
    var v = pickVoice(sex || '男', tone || 'mid');
    if (!v && !warnedVoice) {
      warnedVoice = true;
      toast('系统未装中文语音包，合成朗读可能不准（可在系统设置里添加）');
    }
    stopSynth();
    stopTick();
    paintPlaying(btn);

    var plain = String(text).replace(/[“”"「」]/g, '');
    var u = new SpeechSynthesisUtterance(plain);
    u.lang = v && v.lang ? v.lang : 'zh-CN';
    // 男声本就偏低沉，女声略提亮；老将压一点，少年提一点
    var isF = (sex === '女');
    u.rate = tone === 'grave' ? 0.86 : (tone === 'young' ? 1.0 : 0.93);
    u.pitch = (isF ? 1.05 : 0.94) + (tone === 'grave' ? -0.06 : (tone === 'young' ? 0.07 : 0));
    if (v) u.voice = v;

    // 进度按字数估算（中文约每秒 4.2 字），逐帧推进，与真人语音的手感一致
    synthDur = Math.max(1400, (plain.length / 3.4) * 1000);
    synthAt = performance.now();
    if (synthTimer) clearInterval(synthTimer);
    synthTimer = setInterval(function () {
      if (!playingBtn || playingBtn !== btn) { stopSynth(); return; }
      var p = Math.min(1, (performance.now() - synthAt) / synthDur);
      if (activeLine) {
        activeLine.style.setProperty('--p', p.toFixed(4));
        if (activeW) activeLine.style.setProperty('--pw', (p * activeW).toFixed(1) + 'px');
      }
      if (p >= 1) {
        // 估算只是给进度用，不拿它掐断：真实结束以 onend 为准
        if (synthTimer) { clearInterval(synthTimer); synthTimer = 0; }
        if (activeLine) {
          activeLine.style.setProperty('--p', '1');
          if (activeW) activeLine.style.setProperty('--pw', activeW.toFixed(1) + 'px');
        }
      }
    }, 60);

    u.onend = function () { stopSynth(); paintPlaying(null); };
    u.onerror = function () { stopSynth(); paintPlaying(null); };
    try { synth.speak(u); } catch (e) { stopSynth(); paintPlaying(null); }
  };

  var stopAudio = function () {
    if (!audio.paused) { try { audio.pause(); } catch (e) {} }
    stopSynth();
    stopTick();
    paintPlaying(null);
  };

  /* 播放时按真实进度推进「卡拉OK」擦除：--p 从 0 走到 1 */
  var raf = 0, activeLine = null;

  var stopTick = function () {
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
  };

  var tick = function () {
    raf = 0;
    if (!playingBtn || audio.paused) return;
    var total = audio.duration;
    var p = (isFinite(total) && total > 0) ? Math.min(1, audio.currentTime / total) : 0;
    if (activeLine) {
      activeLine.style.setProperty('--p', p.toFixed(4));
      if (activeW) activeLine.style.setProperty('--pw', (p * activeW).toFixed(1) + 'px');
    }
    raf = requestAnimationFrame(tick);
  };

  var startTick = function () {
    stopTick();
    raf = requestAnimationFrame(tick);
  };

  /* 官方配音：一个技能的原声依次连播，不与逐句文字绑定 */
  var origOn = null, origList = [], origIdx = 0;

  var clearOrig = function () {
    if (origOn) origOn.classList.remove('on');
    origOn = null; origList = []; origIdx = 0;
  };

  var playNextOrig = function () {
    if (!origOn) return;
    if (origIdx >= origList.length) { clearOrig(); return; }
    var src = VOICE_BASE + origList[origIdx++];
    if (audio.getAttribute('src') !== src) audio.setAttribute('src', src);
    var p = audio.play();
    if (p && p.catch) p.catch(function () { clearOrig(); });
  };

  var playOrig = function (btn) {
    var files = String(btn.dataset.orig || '').split('|').filter(Boolean);
    if (!files.length) return;
    if (origOn === btn && !audio.paused) { audio.pause(); clearOrig(); return; }
    stopAudio();
    clearOrig();
    origOn = btn;
    btn.classList.add('on');
    origList = files;
    origIdx = 0;
    toast('播放官方配音 · 共 ' + files.length + ' 段');
    playNextOrig();
  };

  file.addEventListener('click', function (e) {
    var m = e.target && e.target.closest ? e.target.closest('.d-mode button') : null;
    if (m) {
      e.preventDefault();
      e.stopPropagation();
      var mode = m.dataset.mode;
      if (mode && mode !== playMode) {
        playMode = mode;
        try { localStorage.setItem('sgk_playmode_v2', mode); } catch (err) {}
        stopAudio();
        render();
        if (mode === 'tts') {
          toast('朗读：读的就是屏幕上这句');
        } else {
          toast('原声：官方真人配音（改版过的武将，文字与配音可能不是同一版）');
        }
      }
      return;
    }

    var o = e.target && e.target.closest ? e.target.closest('.d-orig') : null;
    if (!o) return;
    e.preventDefault();
    e.stopPropagation();
    playOrig(o);
  });

  audio.addEventListener('ended', function () {
    if (origOn) { playNextOrig(); return; }
    if (activeLine) activeLine.style.setProperty('--p', '1');
    paintPlaying(null);
  });
  audio.addEventListener('pause', stopTick);
  audio.addEventListener('error', function () {
    if (!playingBtn) return;
    paintPlaying(null);
    toast('语音加载失败，可能是源站暂时不可用');
  });

  file.addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('.d-play') : null;
    if (!b || !b.dataset) return;

    /* 合成朗读：没有真人音频的台词，用系统语音读一遍 */
    if (!b.dataset.src && b.dataset.tts) {
      e.preventDefault();
      e.stopPropagation();
      if (playingBtn === b && synth && synth.speaking) { stopAudio(); return; }
      speak(b, b.dataset.tts, b.dataset.sex || '男', b.dataset.tone || 'mid');
      return;
    }

    if (!b.dataset.src) return;
    e.preventDefault();
    e.stopPropagation();
    var src = b.dataset.src;
    if (playingBtn === b && !audio.paused) {
      audio.pause();
      paintPlaying(null);
      return;
    }
    stopSynth();
    paintPlaying(b);
    if (audio.getAttribute('src') !== src) audio.setAttribute('src', src);
    try { audio.currentTime = 0; } catch (err) {}
    var p = audio.play();
    if (p && p.then) p.then(startTick, function () { paintPlaying(null); });
    else startTick();
  });

  var buildSkills = function (d, l) {
    var names = (d.s || []).slice(0);
    var rows = [];
    if (l && l.s && l.s.length) {
      /* 以本期卡面的技能为准，按名字取回原文；对不上的（版本差异）再补在后面 */
      var map = {};
      l.s.forEach(function (pair) { map[pair[0]] = pair[1]; });
      var used = {};
      names.forEach(function (nm) {
        if (map[nm]) { used[nm] = 1; rows.push([nm, map[nm]]); }
      });
      l.s.forEach(function (pair) { if (!used[pair[0]]) rows.push([pair[0], pair[1]]); });
    }
    if (!rows.length) {
      if (!names.length) return '<p class="d-hint">本期卡面未标注技能。</p>';
      return '<p class="d-hint">' + names.map(esc).join(' · ') +
        '<br>技能原文暂未收录。</p>';
    }
    return rows.map(function (r) {
      return '<div class="d-skill"><b>' + esc(r[0]) + '</b><span>' +
        (r[1] ? esc(r[1]) : '<em style="opacity:.6;font-style:normal">原文待补</em>') + '</span></div>';
    }).join('');
  };

  /* 台词行 + 逐句语音：语音按技能名与台词行顺序对齐，
     台词文本缺行时用语音自带的文稿补，只有语音没有文稿的技能也单独列出来 */
  /* 按称号与势力判断该用什么调门：少年清亮、老将/神将沉厚 */
  var toneOf = function (d) {
    if (!d) return 'mid';
    if (d.p === 'shen') return 'grave';
    var t = String(d.t || '') + String(d.n || '');
    if (/少|幼|童|孩|稚/.test(t)) return 'young';
    if (/老|太后|太尉|大将军|仙人|佛陀|天公|魔王/.test(t)) return 'grave';
    return 'mid';
  };

  var buildQuotes = function (l, name, sex, tone) {
    var vg = (voice && voice[name]) || [];
    var vmap = {};
    vg.forEach(function (g) { vmap[g[0]] = g[1] || []; });

    var groups = [];
    if (vg.length) {
      // 有原声就以原声为准：只显示真实语音覆盖的句子，文字直接用语音对应的台词，
      // 不再拿档案里的文本去配另一段音频（那正是之前「音文对不上」的原因）。
      vg.forEach(function (g) {
        groups.push({ skill: g[0], lines: (g[1] || []).map(function (x) { return x[1]; }), vs: g[1] || [] });
      });
    } else if (l && l.q) {
      l.q.forEach(function (q) {
        groups.push({ skill: q[0], lines: (q[1] || []).slice(0), vs: [] });
      });
    }

    if (!groups.length) {
      if (voiceState === 0 || voiceState === 1) {
        return '<span class="d-skel"></span><span class="d-skel"></span>';
      }
      return '<p class="d-hint">台词与语音暂未收录。</p>';
    }

    return groups.map(function (g) {
      var vs = g.vs || [];
      var n = Math.max(g.lines.length, vs.length);
      var rows = '';
      for (var i = 0; i < n; i++) {
        var text = (vs[i] && vs[i][1]) || g.lines[i] || '';
        var f = vs[i] && vs[i][0];
        var shown = text ? '“' + esc(text) + '”' : '';
        var btn;
        if (f) {
          // 官方原声：听到的是真人配音，文字即这段配音的逐条听写
          btn = '<button type="button" class="d-play" data-src="' + esc(VOICE_BASE + f) +
            '" aria-label="播放官方配音"><i></i></button>';
        } else if (text) {
          // 朗读模式（或该句没有配音）：读的就是这句文字
          btn = '<button type="button" class="d-play d-synth" data-tts="' + esc(text) +
            '" data-sex="' + esc(sex || '男') + '" data-tone="' + esc(tone || 'mid') +
            '" aria-label="合成朗读这句台词" title="合成朗读（系统语音，不是官网配音）"><i></i></button>';
        } else {
          btn = '<span class="d-play d-nosrc"></span>';
        }
        rows += '<p class="d-line">' + btn +
          '<span class="d-txt"><span class="d-base">' + shown + '</span>' +
          ((f || text) ? '<span class="d-fill" aria-hidden="true">' + shown + '</span>' : '') +
          '</span></p>';
      }
      return '<div class="d-quote"><b>' + esc(g.skill) + '</b><div>' + rows + '</div></div>';
    }).join('');
  };

  var buildStory = function (name) {
    if (storyState === 3) return '<p class="d-hint">传记暂未收录。</p>';
    if (story && story[name]) return '<p class="d-story">' + esc(story[name]) + '</p>';
    if (story && !story[name]) return '<p class="d-hint">本将传记暂未收录。</p>';
    return '<button type="button" class="d-more" data-story="1"' +
      (storyState === 1 ? ' disabled' : '') + '>读 传 记<i style="font-style:normal">＋</i></button>';
  };

  var render = function () {
    if (!lb.classList.contains('on')) return;
    var v;
    try { v = vis(); } catch (e) { return; }
    var idx = 0;
    try { idx = cur; } catch (e) { idx = 0; }
    var f = v[idx];
    if (!f) return;
    var d = cardData(f);
    var name = d.n || (f.dataset.k ? decodeURIComponent(f.dataset.k) : '');
    var l = lore ? lore[name] : null;
    var all = getFigs();
    var no = f.dataset.no || (all ? pad3(all.indexOf(f) + 1) : '—');
    var total = (all && all.length) || v.length;
    var fac = POW[d.p || f.dataset.p] || '—';
    var modes = (f.dataset.mode || '').split(/[,，、\s]+/).filter(Boolean);
    var hasVoice = !!(voice && voice[name] && voice[name].length);
    var hasQuote = !!(l && l.q && l.q.length);

    var html =
      '<div class="d-head">' +
        '<span class="d-no">NO. ' + esc(no) + '<i>/ ' + total + '</i></span>' +
        '<h3 class="d-name">' + esc(name) + '</h3>' +
        '<span class="d-title">' + esc(d.t || '未知称号') + '</span>' +
      '</div>' +
      '<dl class="d-grid">' +
        '<div><dt>势力</dt><dd>' + esc(fac) + '</dd></div>' +
        '<div><dt>体力</dt><dd>' + esc(d.hp != null ? d.hp + ' 点' : '—') + '</dd></div>' +
        '<div><dt>版本</dt><dd>' + esc(d.v || f.dataset.v || '—') + '</dd></div>' +
        '<div><dt>性别</dt><dd>' + esc(f.dataset.sex || '—') + '</dd></div>' +
      '</dl>' +
      '<dl class="d-rows">' +
        (d.pk ? '<div><dt>卡包</dt><dd>' + esc(d.pk) + '</dd></div>' : '') +
        // 卡图已不署名，面板也不再显示画师来源
        '<div><dt>模式</dt><dd>' + esc(modes.join(' · ') || '—') + '</dd></div>' +
        '<div><dt>卷次</dt><dd>' + esc(fac) + '势力</dd></div>' +
      '</dl>' +
      '<div class="d-cols">' +
        '<section class="d-sec"><h4>技 能</h4>' +
          (l ? buildSkills(d, l) :
            (loreState === 2 || loreState === 3 ? buildSkills(d, null) :
              '<span class="d-skel"></span><span class="d-skel"></span><span class="d-skel"></span>')) +
        '</section>' +
        '<section class="d-sec"><h4>台 词' + (hasVoice || hasQuote ? ' · 原 声' : '') + '</h4>' +
          buildQuotes(l, name, (f && f.dataset && f.dataset.sex) || '男', toneOf(d)) +
        '</section>' +
      '</div>' +
      '<section class="d-sec"><h4>传 记</h4>' + buildStory(name) + '</section>';

    var same = (name === lastKey);
    var keep = same ? info.scrollTop : 0;
    lastKey = name;
    if (!same) stopAudio();
    file.innerHTML = html;
    info.scrollTop = keep;

    var more = file.querySelector('[data-story]');
    if (more) {
      more.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        more.disabled = true;
        more.textContent = '调阅中…';
        loadStory(function () { render(); });
      });
    }

    if (!lore && loreState === 0) loadLore(function () { render(); });
    if (!voice && voiceState === 0) loadVoice(function () { render(); });
  };

  /* 所有打开路径（按钮 / 方向键 / ?card= 直达 / 随机）都会让 #lb 挂上 .on，
     在这里统一接一次，比逐个包 open 更稳 */
  if ('MutationObserver' in window) {
    new MutationObserver(function () {
      if (lb.classList.contains('on')) render();
      else stopAudio();
    }).observe(lb, { attributes: true, attributeFilter: ['class'] });
  }

  /* 灯箱里按 ← / → 翻件时 #lb 一直是 .on，不会触发上面的观察器，
     所以再包一层 open，翻页后立刻换档案 */
  if (typeof open === 'function') {
    var _openD = open;
    open = function (i) {
      _openD(i);
      render();
    };
  }

  if (lb.classList.contains('on')) render();

  /* 切换主题时，卡背由内核重画；档案面板是纯 CSS 变量，无需处理 */
})();

</script>
</body></html>
